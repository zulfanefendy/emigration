services:
  web:
    # Image dibangun di GitHub Actions lalu ditarik dari GHCR.
    # Tidak ada build di VPS -> tidak ada lagi masalah kehabisan disk.
    image: ${IMAGE_REF}
    restart: always
    ports:
      # Hanya bisa diakses dari VPS sendiri; publik masuk lewat Nginx (HTTPS).
      # Lihat deploy/nginx/emigration-prod.conf
      - "127.0.0.1:${APP_PORT:-3000}:3000"
    env_file:
      - .env
    networks:
      - default
      - infra_default

  # Menjalankan migrasi + seed sebelum web di-restart:
  #   docker compose --profile migrate run --rm migrate
  migrate:
    image: ${MIGRATE_IMAGE_REF}
    profiles: ["migrate"]
    restart: "no"
    env_file:
      - .env
    networks:
      - infra_default

networks:
  # Network milik stack Postgres di /var/www/infra.
  # Dibutuhkan agar app bisa menghubungi host "postgres_db".
  infra_default:
    external: true
