name: Deploy to VPS (Dev & Prod)

on:
  push:
    branches: [main, develop]

env:
  IMAGE_NAME: ghcr.io/zulfanefendy/emigration

jobs:
  # ---------------------------------------------------------------
  # 1. Build image di runner GitHub (disk 14GB, dibuang tiap selesai)
  # ---------------------------------------------------------------
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_ref: ${{ steps.meta.outputs.image_ref }}
      migrate_image_ref: ${{ steps.meta.outputs.migrate_image_ref }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Tentukan Tag Berdasarkan Branch
        id: meta
        run: |
          if [ "${{ github.ref_name }}" = "main" ]; then
            TAG=prod
          else
            TAG=dev
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "image_ref=${IMAGE_NAME}:${TAG}" >> "$GITHUB_OUTPUT"
          echo "migrate_image_ref=${IMAGE_NAME}:${TAG}-migrate" >> "$GITHUB_OUTPUT"

      - name: Setup Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login ke GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push Image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.meta.outputs.image_ref }}
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
          # Cache layer disimpan di GitHub, bukan di VPS
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & Push Image Migrasi
        uses: docker/build-push-action@v6
        with:
          context: .
          target: migrator
          push: true
          tags: ${{ steps.meta.outputs.migrate_image_ref }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ---------------------------------------------------------------
  # 2. VPS hanya menarik image (~330MB) dan restart container
  # ---------------------------------------------------------------
  deploy:
    needs: build
    permissions:
      contents: read
      packages: read
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Tentukan Environment Berdasarkan Branch
        run: |
          if [ "${{ github.ref_name }}" = "main" ]; then
            echo "TARGET_DIR=/var/www/app-prod" >> $GITHUB_ENV
            echo "APP_PORT=3000" >> $GITHUB_ENV
            echo "APP_ENV=production" >> $GITHUB_ENV
            echo "APP_DOMAIN=31capsuta.com" >> $GITHUB_ENV
            echo "DATABASE_URL=${{ secrets.DATABASE_URL_PROD }}" >> $GITHUB_ENV
            echo "SESSION_SECRET=${{ secrets.SESSION_SECRET_PROD }}" >> $GITHUB_ENV
          else
            echo "TARGET_DIR=/var/www/app-dev" >> $GITHUB_ENV
            echo "APP_PORT=3001" >> $GITHUB_ENV
            echo "APP_ENV=development" >> $GITHUB_ENV
            echo "APP_DOMAIN=dev.31capsuta.com" >> $GITHUB_ENV
            echo "DATABASE_URL=${{ secrets.DATABASE_URL_DEV }}" >> $GITHUB_ENV
            echo "SESSION_SECRET=${{ secrets.SESSION_SECRET_DEV }}" >> $GITHUB_ENV
          fi

      - name: Kirim docker-compose.yml ke VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: 103.59.95.107
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: docker-compose.yml
          target: ${{ env.TARGET_DIR }}

      - name: Pull Image & Restart Container
        uses: appleboy/ssh-action@v1
        with:
          host: 103.59.95.107
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: TARGET_DIR,APP_PORT,APP_ENV,APP_DOMAIN,DATABASE_URL,SESSION_SECRET,SEED_ADMIN_EMAIL,SEED_ADMIN_PASSWORD,IMAGE_REF,MIGRATE_IMAGE_REF,GHCR_USER,GHCR_TOKEN
          script_stop: true
          script: |
            set -e
            cd "$TARGET_DIR"

            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin

            # .env hanya berisi rujukan; kredensial datang dari GitHub Secrets
            umask 077
            cat > .env <<ENVFILE
            APP_PORT=$APP_PORT
            APP_ENV=$APP_ENV
            APP_DOMAIN=$APP_DOMAIN
            IMAGE_REF=$IMAGE_REF
            MIGRATE_IMAGE_REF=$MIGRATE_IMAGE_REF
            DATABASE_URL=$DATABASE_URL
            SESSION_SECRET=$SESSION_SECRET
            SEED_ADMIN_EMAIL=$SEED_ADMIN_EMAIL
            SEED_ADMIN_PASSWORD=$SEED_ADMIN_PASSWORD
            NODE_ENV=production
            ENVFILE

            docker compose --profile migrate pull

            # Skema DB harus sudah terbaru sebelum versi web yang baru jalan
            docker compose --profile migrate run --rm migrate

            docker compose up -d --remove-orphans

            # Jaga disk VPS tetap lega
            docker image prune -f
            docker logout ghcr.io
        env:
          IMAGE_REF: ${{ needs.build.outputs.image_ref }}
          MIGRATE_IMAGE_REF: ${{ needs.build.outputs.migrate_image_ref }}
          SEED_ADMIN_EMAIL: ${{ secrets.SEED_ADMIN_EMAIL }}
          SEED_ADMIN_PASSWORD: ${{ secrets.SEED_ADMIN_PASSWORD }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
