# Reverse proxy Nginx untuk 31capsuta.com (prod, branch main).
# Pasangannya di VPS: /etc/nginx/sites-available/emigration-dev (dev.31capsuta.com -> 3001).
#
# Pasang di VPS:
#   sudo cp 31capsuta-proxy.conf /etc/nginx/snippets/
#   sudo cp emigration-prod.conf /etc/nginx/sites-available/emigration-prod
#   sudo ln -sf /etc/nginx/sites-available/emigration-prod /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d 31capsuta.com --redirect
#
# Certbot menambahkan blok listen 443 + sertifikat dan mengubah port 80
# menjadi redirect ke HTTPS. Perpanjangan berjalan otomatis lewat systemd timer.

server {
    listen 80;
    server_name 31capsuta.com;

    location / {
        proxy_pass http://127.0.0.1:3000;
        include /etc/nginx/snippets/31capsuta-proxy.conf;
    }
}
