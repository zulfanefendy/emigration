# Reverse proxy Nginx untuk 31capsuta.com (prod) & dev.31capsuta.com (dev).
#
# Pasang di VPS:
#   sudo cp 31capsuta.com.conf /etc/nginx/sites-available/31capsuta.com
#   sudo ln -sf /etc/nginx/sites-available/31capsuta.com /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d 31capsuta.com -d dev.31capsuta.com --redirect
#
# Certbot akan menambahkan blok listen 443 + sertifikat dan mengubah port 80
# menjadi redirect ke HTTPS. Perpanjangan sertifikat berjalan otomatis
# lewat systemd timer bawaan paket certbot.

# Production -> container app-prod (branch main)
server {
    listen 80;
    listen [::]:80;
    server_name 31capsuta.com;

    location / {
        proxy_pass http://127.0.0.1:3000;
        include /etc/nginx/snippets/31capsuta-proxy.conf;
    }
}

# Development -> container app-dev (branch develop)
server {
    listen 80;
    listen [::]:80;
    server_name dev.31capsuta.com;

    location / {
        proxy_pass http://127.0.0.1:3001;
        include /etc/nginx/snippets/31capsuta-proxy.conf;
    }
}
